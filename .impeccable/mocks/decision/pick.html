<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}body{width:1440px;height:900px;color:#000;font-family:Geneva,Verdana,sans-serif;overflow:hidden;position:relative;background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/4px 4px}
.bar{position:absolute;inset:0 0 auto 0;height:40px;background:#fff;border-bottom:2px solid #000;display:flex;gap:40px;align-items:center;padding:0 24px;font-weight:700;font-size:15px}
.win{position:absolute;background:#fff;border:2px solid #000;box-shadow:4px 4px 0 #000}
.title{height:30px;border-bottom:2px solid #000;background:repeating-linear-gradient(#000 0 1px,#fff 1px 3px);display:flex;justify-content:center}
.title span{background:#fff;padding:0 10px;font-weight:700;font-size:15px}
.w1{left:80px;top:90px;width:560px;height:700px}.w2{left:700px;top:140px;width:660px;height:420px}.w3{left:760px;top:600px;width:520px;height:200px}
.por{margin:20px;height:610px;background:radial-gradient(circle,#000 30%,transparent 32%) 0 0/5px 5px}
h1{font:700 96px/1 Geneva,Verdana;margin:30px}.cy{background:#59EBFF;padding:0 8px}
.btn{margin:30px;display:inline-block;border:3px double #000;border-radius:10px;padding:12px 28px;font-weight:700;font-size:24px}
</style></head><body>
<div class="bar"><span>File</span><span>Work</span><span>About</span><span>Contact</span></div>
<div class="win w1"><div class="title"><span>camilo.pict</span></div><div class="por"></div></div>
<div class="win w2"><div class="title"><span>Read Me</span></div><h1>Camilo <span class="cy">Parra</span></h1></div>
<div class="win w3"><div class="title"><span>CV</span></div><div class="btn">Download CV</div></div>
</body></html>
