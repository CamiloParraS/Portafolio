<script>
var x = document.getElementById("c").getContext("2d");
for (var i = 0; i < 9000; i++) {
  var a = Math.random() * 6.283, r = Math.sqrt(Math.random());
  var px = 350 + Math.cos(a) * r * 230, py = 360 + Math.sin(a) * r * 300;
  if (py > 560) px = 350 + (Math.random() - .5) * (520 + (py - 560)), py = py;
  var shade = 1 - r * 0.8 + Math.sin(px / 30) * 0.1;
  x.fillStyle = Math.random() < shade ? "#22D3EE" : "#0E3A46";
  x.fillRect(Math.round(px / 4) * 4, Math.round(py / 4) * 4, 2.5, 2.5);
}
</script>
