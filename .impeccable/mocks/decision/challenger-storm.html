<!doctype html><html><head><meta charset="utf-8"><style>

h1{position:absolute;left:780px;top:180px;font:900 140px/.85 Arial Black,Arial;letter-spacing:-.03em}

</style></head><body>

<div class="btn">Download CV</div>
<script>
var s = "", c = " .:-=+*#%@";
for (var y = 0; y < 60; y++) { var r = ""; for (var x = 0; x < 86; x++) { var dx = (x - 43) / 30, dy = (y - 26) / 26, d = dx * dx + dy * dy; r += d < 1 ? c[Math.min(9, Math.floor((1 - d) * 9 + Math.random() * 2))] : (Math.random() < .04 ? "abcdefgh"[x % 8] : " "); } s += r + "\n"; }
document.getElementById("a").textContent = s;
</script>
