<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}body{width:1440px;height:900px;background:#0A0A0A;color:#FAFAFA;font-family:Arial,sans-serif;overflow:hidden;position:relative}
nav{height:64px;display:flex;justify-content:space-between;align-items:center;padding:0 120px;border-bottom:1px solid #222;font-size:15px}
.av{position:absolute;left:120px;top:150px;width:120px;height:120px;border-radius:50%;background:#333}
h1{position:absolute;left:120px;top:300px;font-size:72px;font-weight:700}
p{position:absolute;left:120px;top:400px;width:640px;font-size:24px;color:#aaa;line-height:1.4}
.b{position:absolute;left:120px;top:520px;background:#22D3EE;color:#000;font-size:22px;padding:14px 26px;border-radius:8px}
.grid{position:absolute;left:120px;right:120px;top:640px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px}
.grid div{height:220px;border:1px solid #222;border-radius:12px;background:#111}
.dith{position:absolute;right:120px;top:120px;width:380px;height:420px;background:radial-gradient(circle,#22D3EE 30%,transparent 32%) 0 0/7px 7px;opacity:.5;border-radius:12px}
</style></head><body>
<nav><b>camilo.dev</b><span>About · Projects · Experience · Contact</span></nav>

</body></html>
