<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#e60012;color:#000;font-family:ui-monospace,monospace}
.half{position:absolute;inset:0;background:radial-gradient(circle,#000 2.2px,transparent 2.6px) 0 0/8px 8px;opacity:.35}
.slab{position:absolute;left:-60px;top:250px;width:1000px;height:380px;background:#000;clip-path:polygon(0 12%,100% 0,92% 100%,4% 86%)}
.letters{position:absolute;left:80px;top:290px;display:flex;flex-wrap:wrap;width:820px;gap:6px;transform:rotate(-6deg)}
.letters b{font:900 120px/1 "Arial Black";padding:0 10px}
.w{background:#fff;color:#000}.r{background:#e60012;color:#fff}.k{background:#000;color:#fff;border:4px solid #fff}
.card{position:absolute;right:110px;top:110px;width:380px;height:560px;background:#fff;transform:rotate(7deg);clip-path:polygon(0 0,100% 3%,94% 100%,4% 96%);background-image:radial-gradient(circle,#000 1.6px,transparent 1.8px);background-size:5px 5px}
.nav{position:absolute;top:30px;left:60px;display:flex;gap:30px;font:900 30px "Arial Black";color:#fff;-webkit-text-stroke:2px #000;transform:rotate(-3deg)}
.cv{position:absolute;left:90px;bottom:70px;background:#000;color:#fff;font:900 34px "Arial Black";padding:16px 34px;transform:rotate(-4deg)}
</style></head><body><div class="half"></div><div class="slab"></div><div class="card"></div>
<div class="nav"><span>WORK</span><span>ABOUT</span><span>CONFIDANTS</span><span>CALLING CARD</span><span>EN/ES</span></div>
<div class="letters"><b class="w">CA</b><b class="r">MI</b><b class="k">LO</b><b class="w">PA</b><b class="k">RR</b><b class="r">A</b></div>
<div class="cv">TAKE MY CV ▸</div></body></html>
