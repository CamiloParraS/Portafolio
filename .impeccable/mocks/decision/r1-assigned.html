<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#06103a;color:#eaf6ff;font-family:ui-monospace,monospace}
canvas{position:absolute;inset:0}
.clock{position:absolute;left:60px;top:40px;font:italic 900 300px/1 "Arial Black",sans-serif;color:#0d2a7a;letter-spacing:-12px;transform:skewX(-12deg)}
h1{position:absolute;left:90px;top:330px;margin:0;font:italic 900 150px/0.86 "Arial Black",sans-serif;text-transform:uppercase;transform:rotate(-8deg) skewX(-10deg);transform-origin:left;color:#eaf6ff}
h1 em{font-style:inherit;color:#3ec6ff}
.menu{position:absolute;right:70px;top:150px;display:flex;flex-direction:column;gap:6px;transform:rotate(-8deg)}
.menu span{font:italic 900 56px/1 "Arial Black";text-transform:uppercase;color:#9fc4ff;padding:4px 30px}
.menu .on{background:#3ec6ff;color:#06103a;clip-path:polygon(4% 0,100% 0,96% 100%,0 100%);transform:translateX(-40px)}
.portrait{position:absolute;right:430px;top:120px;width:300px;height:620px;transform:rotate(-8deg);background:radial-gradient(circle,#3ec6ff 1.6px,transparent 1.8px) 0 0/5px 5px;opacity:.9;clip-path:polygon(15% 0,100% 0,85% 100%,0 100%)}
.save{position:absolute;left:96px;bottom:70px;background:#eaf6ff;color:#06103a;font:italic 900 30px "Arial Black";padding:16px 34px;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}
.day{position:absolute;right:70px;bottom:60px;font:700 24px monospace;color:#3ec6ff}
</style></head><body><canvas id="c" width="1440" height="900"></canvas>
<div class="clock">00:00</div>
<div class="portrait"></div>
<h1>Camilo<br><em>Parra</em></h1>
<div class="menu"><span class="on">Work</span><span>About</span><span>Social Link</span><span>Record</span><span>Contact</span></div>
<div class="save">▸ SAVE DATA · CV</div><div class="day">10/19 MON · DARK HOUR · EN/ES</div>
<script>
const x=document.getElementById("c").getContext("2d"),im=x.createImageData(1440,900),B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
for(let y=0;y<900;y++)for(let i=0;i<1440;i++){const dm=Math.hypot(i-1150,y-210);let v=dm<150?0.95:Math.exp(-(dm-150)/220)*0.45;if(y>560)v=0.18+0.25*Math.max(0,Math.sin(i*0.02+Math.sin(y*0.05)*3)*Math.sin(y*0.09));const on=v>B[y%4][i%4]/16;const p=(y*1440+i)*4;im.data[p]=on?62:6;im.data[p+1]=on?198:16;im.data[p+2]=on?255:58;im.data[p+3]=255}x.putImageData(im,0,0);
</script></body></html>
