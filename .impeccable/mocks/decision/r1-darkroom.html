<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}body{width:1440px;height:900px;background:#140603;color:#FF8A1F;font-family:Arial Narrow,Arial,sans-serif;overflow:hidden;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 30% 10%,rgba(255,110,20,.28),transparent 70%)}
.tray{position:absolute;left:60px;top:120px;width:640px;height:700px;background:#24100a;border:14px solid #3a1a10;border-radius:10px}
.print{position:absolute;left:110px;top:170px;width:540px;height:600px;background:radial-gradient(circle,#0b0402 36%,transparent 38%) 0 0/6px 6px,#e9c9a8;-webkit-mask:linear-gradient(#000 55%,transparent 85%)}
.timer{position:absolute;left:780px;top:110px;font:700 30px "Courier New";letter-spacing:.1em}
h1{position:absolute;left:780px;top:170px;font:900 120px/.9 Arial Black,Arial;color:#FFB26B}
p{position:absolute;left:780px;top:430px;width:560px;font-size:26px;line-height:1.35;color:#e6a070}
.steps{position:absolute;left:780px;top:560px;display:flex;gap:0}
.steps div{width:120px;height:60px;border:1px solid #FF8A1F;font:700 15px Arial;padding:8px;letter-spacing:.12em}
.steps .on{background:#FF8A1F;color:#140603}
.btn{position:absolute;left:780px;top:690px;background:#FF8A1F;color:#140603;font:700 26px Arial;padding:16px 30px}
.line{position:absolute;left:0;right:0;top:64px;border-top:2px solid #5a2a14}
</style></head><body><div class="glow"></div><div class="line"></div>
<div class="tray"></div><div class="print"></div>
<div class="timer">DEVELOP 00:42</div>
<h1>CAMILO<br>PARRA</h1>
<p>Software engineering student, Pasto. Developing: MAGI, a local semantic search engine in Rust.</p>
<div class="steps"><div class="on">EXPOSE</div><div>DEVELOP</div><div>FIX</div><div>WASH</div><div>DRY</div></div>
<div class="btn">Pull the print (CV)</div>
</body></html>
